# Railway Configuration for Meta Agent Mobile
# This file configures Railway deployment settings

[build]
# Use Nixpacks builder (Railway's default)
builder = "nixpacks"
# Build command
buildCommand = "pnpm install && pnpm build"

[deploy]
# Start command for the Glass API server
startCommand = "node dist/index.js"
# Health check endpoint
healthcheckPath = "/api/health"
healthcheckTimeout = 300
# Restart policy
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[service]
# Internal port the service listens on
internalPort = 3000
