version: '3.8'

# =============================================================================
# Meta Agent Mobile - Production Docker Compose
# =============================================================================
# This configuration deploys the complete Meta Agent ecosystem:
# - Glass API Server (orchestrator, R execution, skills)
# - Mobile API Server (tRPC endpoints, user data, sync)
# - PostgreSQL Database
# - Redis Cache
# - R Worker Pool (auto-scaling)
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Glass API Server
  # Exposes the orchestrator, R execution, and skills as REST endpoints
  # ---------------------------------------------------------------------------
  glass-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.glass-api
    container_name: glass-api
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/meta_agent
      - REDIS_URL=redis://redis:6379
      - R_EXECUTION_TIMEOUT=60
      - R_MAX_MEMORY_MB=512
      - API_SECRET_KEY=${API_SECRET_KEY}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - meta-agent-network
    volumes:
      - r-packages:/usr/local/lib/R/site-library
      - temp-files:/tmp/glass

  # ---------------------------------------------------------------------------
  # Mobile API Server
  # Handles tRPC endpoints for the mobile app (user data, projects, sync)
  # ---------------------------------------------------------------------------
  mobile-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.mobile-api
    container_name: mobile-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/meta_agent
      - REDIS_URL=redis://redis:6379
      - GLASS_API_URL=http://glass-api:4000
      - JWT_SECRET=${JWT_SECRET}
      - OAUTH_CLIENT_ID=${OAUTH_CLIENT_ID}
      - OAUTH_CLIENT_SECRET=${OAUTH_CLIENT_SECRET}
      - S3_BUCKET=${S3_BUCKET}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_ENDPOINT=${S3_ENDPOINT}
    depends_on:
      db:
        condition: service_healthy
      glass-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - meta-agent-network

  # ---------------------------------------------------------------------------
  # PostgreSQL Database
  # Stores users, projects, studies, analysis history, and collaboration data
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: meta-agent-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=meta_agent
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d meta_agent"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - meta-agent-network

  # ---------------------------------------------------------------------------
  # Redis Cache
  # Handles sessions, rate limiting, pub/sub for real-time features
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: meta-agent-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - meta-agent-network

  # ---------------------------------------------------------------------------
  # R Worker Pool
  # Executes R code in isolated Firejail sandboxes
  # Auto-scales based on queue depth (1-10 workers)
  # ---------------------------------------------------------------------------
  r-worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.r-worker
    restart: unless-stopped
    deploy:
      mode: replicated
      replicas: 2
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M
    environment:
      - REDIS_URL=redis://redis:6379
      - WORKER_QUEUE=r-execution
      - MAX_EXECUTION_TIME=60
      - FIREJAIL_ENABLED=true
    depends_on:
      - redis
    volumes:
      - r-packages:/usr/local/lib/R/site-library:ro
      - temp-files:/tmp/r-work
    networks:
      - meta-agent-network
    security_opt:
      - seccomp:unconfined  # Required for Firejail

  # ---------------------------------------------------------------------------
  # Caddy Reverse Proxy (Optional - for SSL/TLS)
  # Automatically handles HTTPS certificates via Let's Encrypt
  # ---------------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    container_name: meta-agent-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - glass-api
      - mobile-api
    networks:
      - meta-agent-network
    profiles:
      - production

# =============================================================================
# Networks
# =============================================================================
networks:
  meta-agent-network:
    driver: bridge

# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  r-packages:
    driver: local
  temp-files:
    driver: local
  caddy-data:
    driver: local
  caddy-config:
    driver: local
